<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<meta name="description" content="Get early access to CASPIAN — Thinker. Doer.">
<title>CASPIAN — Thinker. Doer.</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #050505;
    --fg: #f5f5f5;
    --muted: #a6a6a6;
    --line: rgba(255,255,255,.18);
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; color: var(--fg); background: var(--bg);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(195,210,255,.075), transparent 36%),
      radial-gradient(ellipse at 50% 110%, rgba(255,255,255,.055), transparent 50%);
  }
  .noise {
    position: fixed; inset: -50%; width: 200%; height: 200%; z-index: 5;
    pointer-events: none; opacity: .075;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    animation: noiseDrift .22s steps(2) infinite;
  }
  @keyframes noiseDrift { 0%{transform:translate(0,0)} 25%{transform:translate(1%,-1%)} 50%{transform:translate(-1%,1%)} 75%{transform:translate(1%,1%)} }
  .page {
    position: relative; z-index: 1; min-height: 100svh; width: min(100%, 1180px);
    margin: 0 auto; padding: 24px clamp(20px, 5vw, 64px) 26px;
    display: flex; flex-direction: column;
  }
  header, footer { display:flex; align-items:center; justify-content:space-between; gap:18px; }
  .wordmark { font-size: 12px; letter-spacing: .26em; font-weight: 650; }
  .status { color: #c7c7c7; font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; }
  .status::before { content:""; display:inline-block; width:6px; height:6px; margin:0 9px 1px 0; border-radius:50%; background:#f3f3f3; box-shadow:0 0 12px #fff; animation: statusPulse 2s ease-in-out infinite; }
  @keyframes statusPulse { 50%{opacity:.35;box-shadow:0 0 3px #fff} }
  main { flex:1; display:grid; grid-template-columns: 1fr 1fr; align-items:center; gap: clamp(22px, 5vw, 72px); padding: 28px 0 36px; }
  .art-wrap { position:relative; width:100%; max-width:490px; margin:0 auto; isolation:isolate; aspect-ratio:1/1.02; }
  .art {
    position:absolute; z-index:0; top:0; left:50%; width:115%; height:auto;
    object-fit:contain; transform:translate(-50%,-35.3%);
    filter:blur(15px) brightness(1.02) contrast(1.2); opacity:.68; mix-blend-mode:screen;
    -webkit-mask-image:radial-gradient(ellipse 25% 18% at 50% 57.5%, #000 34%, rgba(0,0,0,.45) 62%, transparent 90%);
    mask-image:radial-gradient(ellipse 25% 18% at 50% 57.5%, #000 34%, rgba(0,0,0,.45) 62%, transparent 90%);
    animation: artBgPulse 7s ease-in-out infinite;
  }
  @keyframes artBgPulse {
    0%,100%{opacity:.58; transform:translate(-50%,calc(-35.3% - .3%)) scale(1.02); filter:blur(13px) brightness(.96) contrast(1.14)}
    50%{opacity:.8; transform:translate(-49.6%,calc(-35.3% + .3%)) scale(1.055); filter:blur(17px) brightness(1.08) contrast(1.24)}
  }
  @keyframes artFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  @keyframes artGlow { 0%,100%{filter:contrast(1.04) brightness(.88) drop-shadow(0 0 18px rgba(230,240,255,.06))} 50%{filter:contrast(1.1) brightness(1.08) drop-shadow(0 0 34px rgba(230,240,255,.2))} }
  .scan {
    position:absolute; z-index:2; left:4%; right:4%; top:18%; height:1px; pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.02),rgba(255,255,255,.8),rgba(255,255,255,.02),transparent);
    box-shadow:0 0 16px rgba(255,255,255,.45); opacity:0; animation: scanPass 6.5s ease-in-out infinite;
  }
  @keyframes scanPass { 0%{top:17%;opacity:0} 9%{opacity:.55} 70%{opacity:.4} 90%{top:83%;opacity:0} 100%{top:83%;opacity:0} }
  .copy { max-width:470px; padding: 24px 0; }
  .eyebrow { color:#a6a6a6; font: 10px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.23em; text-transform:uppercase; }
  h1 { margin:16px 0 5px; font-size:clamp(42px, 6vw, 76px); line-height:.98; letter-spacing:.08em; font-weight:500; }
  .tagline { margin:14px 0 27px; color:#d8d8d8; font:clamp(12px,1.6vw,15px)/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.22em; }
  .form { margin-top:30px; }
  .form-label { display:block; margin-bottom:10px; color:#d4d4d4; font:10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.15em; text-transform:uppercase; }
  .signup { display:flex; width:100%; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.025); transition:border-color .25s, background .25s; }
  .signup:focus-within { border-color:rgba(255,255,255,.75); background:rgba(255,255,255,.055); }
  input[type=email] { min-width:0; flex:1; padding:16px 14px; color:#fff; background:transparent; border:0; outline:0; font:13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  input::placeholder { color:#747474; }
  button { padding:0 17px; border:0; border-left:1px solid var(--line); background:#f1f1f1; color:#080808; font:10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.08em; cursor:pointer; transition:background .2s, color .2s; white-space:nowrap; }
  button:hover { background:#cfcfcf; }
  button:focus-visible, input:focus-visible { outline:2px solid white; outline-offset:3px; }
  .message { min-height:20px; margin-top:12px; color:#e7e7e7; font:11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .message.error { color:#ffbdbd; }
  .meta { display:flex; flex-wrap:wrap; gap:10px 22px; color:#777; font:9px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.12em; text-transform:uppercase; }
  footer { padding-top:18px; border-top:1px solid rgba(255,255,255,.1); color:#707070; font:9px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.1em; text-transform:uppercase; }
  #dither-intro { position:fixed; inset:0; z-index:60; background:var(--bg); opacity:1; transition:opacity .8s ease .05s; }
  #dither-intro.done { opacity:0; pointer-events:none; }
  #dither-canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
  @media (max-width:760px) {
    .page { padding-top:20px; }
    main { grid-template-columns:1fr; gap:0; padding:14px 0 28px; }
    .art-wrap { width:min(86%, 360px); margin:-3px auto -12px; }
    .copy { width:min(100%, 500px); margin:0 auto; padding:4px 0 18px; }
    h1 { font-size:clamp(42px, 12vw, 64px); }
    .tagline { margin:12px 0 19px; }
    .form { margin-top:23px; }
    footer { align-items:flex-start; }
  }
  @media (max-width:380px) {
    .status { font-size:8px; letter-spacing:.1em; }
    .signup { flex-direction:column; }
    button { min-height:46px; border-left:0; border-top:1px solid var(--line); }
    footer { font-size:8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }
</style>
</head>

<script>
  /*
   * WAITLIST BACKEND — Formspree:
   * 1. Create a free form at https://formspree.io (use your page URL as the form's site).
   * 2. Copy the form ID (8 characters, e.g. "xkdoqwer") from your Formspree dashboard.
   * 3. Replace YOUR_FORM_ID below. Done — signups land in your Formspree inbox.
   */
  const WAITLIST_FORM_ID = 'xjygnlyy';
  const WAITLIST_ENDPOINT = 'https://formspree.io/f/' + WAITLIST_FORM_ID;

  const form = document.getElementById('waitlist-form');
  const message = document.getElementById('form-message');
  const emailInput = document.getElementById('email');
  const submitButton = form.querySelector('button[type="submit"]');
  const originalLabel = submitButton.textContent;

  function showMessage(text, isError) {
    message.textContent = text;
    message.className = isError ? 'message error' : 'message';
  }

  function setBusy(busy) {
    submitButton.disabled = busy;
    submitButton.textContent = busy ? 'SENDING…' : originalLabel;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const email = emailInput.value.trim();
    if (!emailInput.checkValidity() || !email) {
      showMessage('Enter a valid email address to continue.', true);
      emailInput.focus();
      return;
    }
    if (WAITLIST_FORM_ID === 'YOUR_FORM_ID') {
      showMessage('Waitlist is not connected yet. Replace YOUR_FORM_ID in caspian-waitlist.html.', true);
      return;
    }

    const honeypot = form.querySelector('input[name="_gotcha"]');

    setBusy(true);
    try {
      const response = await fetch(WAITLIST_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          email,
          _subject: 'CASPIAN waitlist signup',
          _gotcha: honeypot ? honeypot.value : ''
        })
      });
      const data = await response.json().catch(() => ({}));
      if (response.ok) {
        form.reset();
        showMessage('You’re on the list. We’ll signal you when CASPIAN is ready.');
      } else if (response.status === 400 && data.errors) {
        showMessage('That email was rejected as invalid. Please check it and try again.', true);
      } else {
        showMessage('Could not register right now. Please try again in a moment.', true);
      }
    } catch (error) {
      showMessage('Network error — check your connection and try again.', true);
    } finally {
      setBusy(false);
    }
  });
</script>

      var cell = w < 640 ? 5 : 7;
      COLS = Math.max(56, Math.min(260, Math.round(w / cell)));
      ROWS = Math.max(64, Math.min(260, Math.round(h / cell)));
      canvas.width = COLS; canvas.height = ROWS;
      buf = ctx.createImageData(COLS, ROWS);
      lum = null;
    }
    sizeCanvas();
    window.addEventListener('resize', sizeCanvas);

    function buildLum() {
      var artReady = art && art.complete && art.naturalWidth;
      if (lum && hasArt) return;
      hasArt = artReady;
      var s = document.createElement('canvas');
      s.width = COLS; s.height = ROWS;
      var sc = s.getContext('2d');
      sc.fillStyle = '#000'; sc.fillRect(0, 0, COLS, ROWS);
      if (hasArt) {
        var side = Math.min(COLS * 0.9, ROWS * 0.5);
        sc.drawImage(art, art.naturalWidth * 0.27, art.naturalHeight * 0.45, art.naturalWidth * 0.46, art.naturalHeight * 0.33, (COLS - side) / 2, ROWS * 0.07, side, side);
      }
      var fs = Math.max(11, Math.round(ROWS * 0.17));
      sc.fillStyle = '#fff';
      sc.textAlign = 'center'; sc.textBaseline = 'middle';
      sc.font = '700 ' + fs + 'px monospace';
      var kx = Math.min(1.6, (COLS * 0.86) / Math.max(1, sc.measureText('CASPIAN').width));
      sc.save();
      sc.translate(COLS / 2, ROWS * 0.855);
      sc.scale(kx, 1);
      sc.fillText('CASPIAN', 0, 0);
      sc.restore();
      var d = sc.getImageData(0, 0, COLS, ROWS).data;
      lum = new Float32Array(COLS * ROWS);
      for (var i = 0; i < lum.length; i++) lum[i] = (d[i*4] * 0.3 + d[i*4+1] * 0.59 + d[i*4+2] * 0.11) / 255;
    }

    function draw(t) {
      buildLum();
      var emerge = Math.min(1, t / 3400);
      var noiseAmp = 0.52 - 0.30 * emerge;
      var sweepY = ((t % 2200) / 2200) * ROWS;
      var d = buf.data;
      for (var y = 0; y < ROWS; y++) {
        var sweep = Math.max(0, 1 - Math.abs(y - sweepY) / 7) * 0.3;
        for (var x = 0; x < COLS; x++) {
          var i = y * COLS + x;
          var v = (lum[i] || 0) * emerge + (Math.random() - 0.5) * noiseAmp + sweep * (0.4 + 0.6 * Math.random());
          var px = i * 4;
          if (v > (bayer[((y & 7) << 3) | (x & 7)] / 64)) { d[px] = 232; d[px+1] = 232; d[px+2] = 236; }
          else { d[px] = 8; d[px+1] = 8; d[px+2] = 10; }
          d[px+3] = 255;
        }
      }
      ctx.putImageData(buf, 0, 0);
    }

    var started = performance.now(), raf = 0, last = 0, killed = false;
    function loop(now) {
      if (killed) return;
      if (now - last >= 110) { last = now; draw(now - started); }
      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);

    function finish() {
      if (killed) return;
      killed = true;
      cancelAnimationFrame(raf);
      if (reduce) overlay.style.transition = 'none';
      overlay.classList.add('done');
      setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 950);
    }
    var timer = setTimeout(finish, reduce ? 400 : 4800);
    overlay.addEventListener('click', finish);
  })();
</script>
</body>
</html>
