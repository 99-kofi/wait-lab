<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAIT LAB | Admin Dashboard</title>
    <link rel="icon" href="lab_logo.png" type="image/png">
    <script src="https://unpkg.com/lucide@1.68.0/dist/umd/lucide.min.js" integrity="sha384-wnWTr2TdZs5YYvmy/j9VgTRRSmVu6+HuDKAfjAkfBQHvcsI/59wGyMue0LRk0fa7" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js" integrity="sha384-cwS6YdhLI7XS60eoDiC+egV0qHp8zI+Cms46R0nbn8JrmoAzV9uFL60etMZhAnSu" crossorigin="anonymous"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" integrity="sha384-07UbSXbd8HpaOfxZsiO6Y8H1HTX6v0J96b5qP6PKSpYEuSZSYD4GFFHlLRjvjVrL">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js" integrity="sha384-0zm5QqnR2gL4GY5AwreU3xp5AEGWqkdbamrRLeXwWwepp4JqmPRawLJFD8Cm802W"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #121212;
            --primary: #5c6bc0;
            --accent: #ff8a65;
            --secondary: #66bb6a;
            --text-main: #f5f5f5;
            --text-sub: #a0a0a0;
            --border: #262626;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--surface);
            padding: 1.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin: 0.5rem 0;
        }

        .stat-label {
            color: var(--text-sub);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .publish-section {
            background: var(--surface);
            padding: 2rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 3rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-sub);
        }

        input {
            width: 100%;
            padding: 0.8rem;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-main);
            font-family: inherit;
        }

        /* Quill Custom Dark Theme */
        .ql-toolbar.ql-snow {
            border-color: var(--border);
            background: var(--surface);
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
        }
        .ql-container.ql-snow {
            border-color: var(--border);
            background: #1a1a1a;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            min-height: 200px;
        }
        .ql-editor {
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            min-height: 200px;
        }
        .ql-snow .ql-stroke {
            stroke: var(--text-sub);
        }
        .ql-snow .ql-fill, .ql-snow .ql-stroke.ql-fill {
            fill: var(--text-sub);
        }
        .ql-snow .ql-picker {
            color: var(--text-sub);
        }
        .ql-snow .ql-picker-options {
            background-color: var(--surface);
            border-color: var(--border);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .posts-list {
            margin-top: 3rem;
        }

        .post-item {
            background: var(--surface);
            padding: 1.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .post-info h3 {
            margin: 0 0 0.5rem 0;
        }

        .post-info p {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin: 0;
        }

        .post-media-preview {
            max-width: 100px;
            max-height: 100px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 1.5rem;
        }

        .btn-delete {
            background: #ef5350;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }

        /* Auth Overlay */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
        }

        .auth-card {
            background: var(--surface);
            padding: 3rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .auth-card h2 {
            margin-top: 0;
            margin-bottom: 2rem;
            color: var(--primary);
        }

        .auth-card input {
            margin-bottom: 1.5rem;
            padding: 1rem;
            font-size: 16px; /* iOS Safari fix */
            letter-spacing: 2px;
        }

        /* iOS Safari fixes and Mobile Responsiveness */
        input, select, textarea, .ql-editor {
            font-size: 16px !important; /* Prevents iOS auto-zoom on focus */
            -webkit-appearance: none;
            border-radius: 4px;
        }

        .btn {
            -webkit-appearance: none;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            .auth-card {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }
            .stats-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
                margin-bottom: 2rem;
            }
            .post-item {
                flex-direction: column;
            }
            .post-media-preview {
                max-width: 100%;
                width: 100%;
                height: 200px;
                margin-right: 0;
                margin-bottom: 1rem;
            }
            .post-info {
                width: 100%;
                margin-bottom: 1rem;
            }
            .post-actions {
                width: 100%;
                display: flex;
                justify-content: space-between;
                gap: 0.5rem;
            }
            .post-actions button {
                flex: 1;
            }
            header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
            .publish-section {
                padding: 1.5rem 1rem;
            }
            .btn {
                width: 100%;
                margin-bottom: 0.5rem;
            }
            .btn-secondary {
                margin-left: 0 !important;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Gateway -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Admin Authentication</h2>
            <form id="auth-form">
                <input type="password" id="auth-password" placeholder="Enter Password" required>
                <button type="submit" class="btn" style="width: 100%;">Access Secure Portal</button>
            </form>
        </div>
    </div>

    <div class="container" id="main-content" style="display: none;">
        <header>
            <h1>WAIT LAB | Admin</h1>
            <div style="display: flex; align-items: center; gap: 1.5rem;">
                <a href="/" style="color: var(--text-sub); text-decoration: none;">View Site</a>
                <button id="logout-btn" class="btn" style="background: #ef5350; padding: 0.5rem 1.2rem; font-size: 0.85rem;">Logout</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Site Visits</div>
                <div class="stat-value" id="visit-count">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Posts</div>
                <div class="stat-value" id="post-count">0</div>
            </div>
        </div>

        <section class="publish-section">
            <h2>Publish New Post</h2>
            <form id="publish-form">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" required placeholder="Enter post title...">
                </div>
                <div class="form-group">
                    <label for="content">Content</label>
                    <div id="editor-container"></div>
                </div>
                <div class="form-group">
                    <label for="media">Media (Image or Video)</label>
                    <input type="file" id="media" accept="image/*,video/*">
                </div>
                <button type="submit" class="btn">Publish Post</button>
                <button type="button" id="test-post-btn" class="btn btn-secondary" style="background: var(--surface); border: 1px solid var(--border); margin-left: 1rem;">Send Test Post (No Media)</button>
            </form>
        </section>

        <section class="posts-list">
            <h2>Manage Posts</h2>
            <div id="posts-container">
                <!-- Posts will be loaded here -->
            </div>
        </section>
    </div>
    
    <script src="js/admin.js"></script>
</body>
</html>
